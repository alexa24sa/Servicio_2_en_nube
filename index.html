<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Productos - Microservicio</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛍️ Gestor de Productos</h1>
            <p class="subtitle">Microservicio REST API - Sistema Distribuido</p>
        </header>

        <!-- Formulario para agregar productos -->
        <section class="form-section">
            <h2>➕ Agregar Nuevo Producto</h2>
            <form id="productoForm">
                <div class="form-group">
                    <label for="id">ID:</label>
                    <input type="number" id="id" name="id" required>
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" name="precio" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" name="descripcion" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Agregar Producto</button>
            </form>
        </section>

        <!-- Lista de productos -->
        <section class="products-section">
            <div class="section-header">
                <h2>📦 Lista de Productos</h2>
                <button class="btn btn-secondary" onclick="cargarProductos()">🔄 Actualizar</button>
            </div>
            <div id="productosLista" class="productos-grid"></div>
        </section>

        <!-- Modal para editar -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>✏️ Editar Producto</h2>
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label for="editNombre">Nombre:</label>
                        <input type="text" id="editNombre" required>
                    </div>
                    <div class="form-group">
                        <label for="editPrecio">Precio:</label>
                        <input type="number" id="editPrecio" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="editDescripcion">Descripción:</label>
                        <textarea id="editDescripcion" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </form>
            </div>
        </div>

        <!-- Notificaciones -->
        <div id="notification" class="notification"></div>
    </div>

    <footer>
        <p>© 2026 Microservicio de Productos | Sistemas Distribuidos - Práctica 7</p>
    </footer>

    <script src="static/js/app.js"></script>
</body>
</html>
